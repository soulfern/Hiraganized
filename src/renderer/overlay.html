<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Select region</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  cursor: crosshair;
  user-select: none;
  -webkit-app-region: no-drag;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.25);
}
.selection-box {
  position: absolute;
  border: 1.5px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.02);
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.25), 0 0 24px rgba(255,255,255,0.04);
  pointer-events: none;
}
.info {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30,30,30,0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: rgba(255,255,255,0.6);
  padding: 8px 20px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.05);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.2px;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="selection-box" id="selectionBox" style="display:none"></div>
<div class="info" id="info">Drag to select a region &bull; Esc to cancel</div>
<script src="overlay.js"></script>
</body>
</html>
