<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1e1e1e;
      --bg-elevated: #262626;
      --edge: #545454;
      --text: #d9d9d9;
      --text-dim: rgba(217,217,217,0.55);
      --text-faint: rgba(217,217,217,0.32);
      --card: rgba(217,217,217,0.04);
      --card-border: rgba(217,217,217,0.10);
      --card-border-strong: rgba(217,217,217,0.18);
      --accent: #4a7bd6;
      --accent-hover: #5d8be0;
      --accent-dim: rgba(74,123,214,0.18);
      --radius: 14px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .window {
      height: 100vh;
      border: 1px solid var(--edge);
      display: flex;
      flex-direction: column;
    }

    /* Titlebar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 38px;
      flex-shrink: 0;
      position: relative;
      -webkit-app-region: drag;
      padding: 0 10px;
      border-bottom: 1px solid var(--edge);
      background: rgba(217,217,217,0.02);
    }
    .title-text {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .titlebar .btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 8px;
      color: var(--text-faint);
      font-size: 14px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .titlebar .btn:hover { background: rgba(217,217,217,0.08); color: var(--text); }
    .titlebar .btn:last-child:hover { background: rgba(229,104,122,0.18); color: #f0899a; }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0 36px;
    }

    /* Timeline */
    .timeline {
      display: flex;
      padding: 22px 24px 18px;
      gap: 0;
      align-items: flex-start;
    }
    .tl-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .tl-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(217,217,217,0.14);
      border: 1px solid transparent;
      z-index: 1;
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .tl-step.active .tl-dot {
      background: var(--bg);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .tl-step.done .tl-dot { background: var(--accent); }
    .tl-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-top: 7px;
      transition: color 0.25s;
    }
    .tl-step.active .tl-label { color: var(--text); }
    .tl-step.done .tl-label { color: var(--text-dim); }
    .tl-line {
      position: absolute;
      top: 5px;
      left: calc(-50% + 8px);
      right: calc(50% + 8px);
      height: 1px;
      background: rgba(217,217,217,0.12);
    }
    .tl-step:first-child .tl-line { display: none; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .page { display: none; flex: 1; flex-direction: column; padding: 2px 0 22px; }
    .page.active { display: flex; }

    .page-heading { margin-bottom: 16px; }
    .page-heading h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .page-heading p { font-size: 12px; color: var(--text-dim); margin-top: 4px; font-weight: 400; }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    /* Welcome */
    .dir-picker {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dir-picker input {
      flex: 1;
      padding: 9px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      font-weight: 400;
      outline: none;
    }
    .dir-picker input:focus { border-color: var(--accent); }
    .dir-picker button {
      padding: 9px 18px;
      background: transparent;
      border: 1px solid var(--card-border-strong);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .dir-picker button:hover { background: rgba(217,217,217,0.06); color: var(--text); border-color: var(--card-border-strong); }

    .footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 22px;
    }
    .footer button {
      padding: 11px 30px;
      border: none;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: rgba(217,217,217,0.06);
      color: var(--text-dim);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover { background: rgba(217,217,217,0.10); color: var(--text); }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(74,123,214,0.35);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

    /* Progress */
    .progress-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .progress-item {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-item .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .progress-item .row .plabel { color: var(--text); font-weight: 500; }
    .progress-item .row .ppct { color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .progress-item .detail {
      font-size: 10px;
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      height: 4px;
      background: rgba(217,217,217,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .bar-fill.indeterminate {
      width: 40% !important;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    /* Done */
    .done-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }
    .done-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: var(--accent-hover);
    }
    .done-wrap h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .done-wrap .sub { font-size: 12px; color: var(--text-dim); line-height: 1.6; max-width: 360px; }
    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 400;
      margin-top: 4px;
    }
    .checkbox-row input {
      width: 15px; height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .checkbox-row label { cursor: pointer; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="title-text">Hiraganized Installer</span>
      <button class="btn" id="btnMin">&mdash;</button>
      <button class="btn" id="btnClose">&times;</button>
    </div>

    <div class="app">
      <div class="timeline">
        <div class="tl-step active" id="s0">
          <div class="tl-dot"></div>
          <div class="tl-label">Welcome</div>
          <div class="tl-line"></div>
        </div>
        <div class="tl-step" id="s1">
          <div class="tl-dot"></div>
          <div class="tl-label">Installing</div>
          <div class="tl-line"></div>
        </div>
        <div class="tl-step" id="s2">
          <div class="tl-dot"></div>
          <div class="tl-label">Done</div>
          <div class="tl-line"></div>
        </div>
      </div>

      <div class="main">
        <div class="page active" id="page-welcome">
          <div class="page-heading">
            <h1>Install</h1>
            <p>Choose where Hiraganized should be installed.</p>
          </div>
          <div class="card">
            <div class="dir-picker">
              <input id="installDir" value="C:\Program Files\Hiraganized" readonly>
              <button id="btnBrowse">Browse</button>
            </div>
          </div>
          <div class="footer">
            <button class="btn-primary" id="btnInstall">Install</button>
          </div>
        </div>

        <div class="page" id="page-progress">
          <div class="page-heading">
            <h1>Installing</h1>
            <p>This may take a few minutes on the first run.</p>
          </div>
          <div class="progress-section" id="progressList"></div>
          <div class="footer">
            <button class="btn-secondary" id="btnCancel">Cancel</button>
          </div>
        </div>

        <div class="page" id="page-done">
          <div class="done-wrap">
            <div class="done-icon">&#x2713;</div>
            <h1>Installation Complete</h1>
            <div class="sub">Hiraganized has been successfully installed.</div>
            <div class="checkbox-row">
              <input type="checkbox" id="chkLaunch" checked>
              <label for="chkLaunch">Launch Hiraganized now</label>
            </div>
          </div>
          <div class="footer">
            <button class="btn-primary" id="btnFinish">Finish</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
