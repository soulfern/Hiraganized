<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #080808;
      color: #f5f2ef;
      font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 140%;
      height: 90%;
      background: radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.025) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 10s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0%   { opacity: 0.3; transform: scale(1) translateY(0); }
      50%  { opacity: 0.9; transform: scale(1.06) translateY(-2%); }
      100% { opacity: 0.4; transform: scale(0.97) translateY(0); }
    }

    .window {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Titlebar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 36px;
      -webkit-app-region: drag;
      padding: 0 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.01);
    }
    .titlebar .btn {
      -webkit-app-region: no-drag;
      width: 30px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 8px;
      color: rgba(255,255,255,0.3);
      font-size: 14px; cursor: pointer;
      transition: all 0.15s;
    }
    .titlebar .btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.55); }

    .app { display: flex; flex-direction: column; height: calc(100% - 36px); padding: 0 32px; }

    /* Timeline */
    .timeline {
      display: flex;
      padding: 24px 16px 20px;
      gap: 0;
      align-items: flex-start;
    }
    .tl-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .tl-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      z-index: 1;
      transition: all 0.3s;
    }
    .tl-step.active .tl-dot {
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 8px rgba(255,255,255,0.08);
    }
    .tl-step.done .tl-dot { background: rgba(255,255,255,0.25); }
    .tl-label {
      font-size: 10px;
      font-weight: 300;
      color: rgba(255,255,255,0.2);
      margin-top: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .tl-step.active .tl-label { color: rgba(255,255,255,0.5); }
    .tl-step.done .tl-label { color: rgba(255,255,255,0.3); }
    .tl-line {
      position: absolute;
      top: 4px;
      left: calc(-50% + 4px);
      right: calc(50% + 4px);
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .tl-step:first-child .tl-line { display: none; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .page { display: none; flex: 1; flex-direction: column; padding: 4px 8px 20px; }
    .page.active { display: flex; }

    /* Glass card */
    .glass-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .page h1 {
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 20px;
      color: #f5f2ef;
    }

    .dir-picker {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dir-picker input {
      flex: 1;
      padding: 8px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      color: #f5f2ef;
      font-size: 12px;
      font-family: inherit;
      font-weight: 300;
      outline: none;
    }
    .dir-picker input:focus { border-color: rgba(255,255,255,0.2); }
    .dir-picker button {
      padding: 8px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      font-family: inherit;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.15s;
    }
    .dir-picker button:hover { background: rgba(255,255,255,0.12); color: #f5f2ef; }

    .footer {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 20px;
    }
    .footer button {
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 400;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.10); color: #f5f2ef; }
    .btn-primary {
      background: rgba(255,255,255,0.10);
      color: #f5f2ef;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .btn-primary:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.15); }
    .btn-primary:disabled { opacity: 0.25; cursor: default; }

    .progress-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-item .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .progress-item .row .plabel { color: #f5f2ef; font-weight: 400; }
    .progress-item .row .ppct { color: rgba(255,255,255,0.3); font-variant-numeric: tabular-nums; }
    .progress-item .detail {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      transition: width 0.3s;
    }
    .bar-fill.indeterminate {
      width: 40% !important;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    .done-icon {
      font-size: 36px;
      text-align: center;
      margin-bottom: 12px;
      color: rgba(255,255,255,0.3);
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      margin-top: 16px;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
    }
    .checkbox-row input { accent-color: rgba(255,255,255,0.3); width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <button class="btn" id="btnMin">&mdash;</button>
      <button class="btn" id="btnClose">&times;</button>
    </div>

    <div class="app">
      <div class="timeline">
        <div class="tl-step active" id="s0">
          <div class="tl-dot"></div>
          <div class="tl-label">Welcome</div>
          <div class="tl-line"></div>
        </div>
        <div class="tl-step" id="s1">
          <div class="tl-dot"></div>
          <div class="tl-label">Installing</div>
          <div class="tl-line"></div>
        </div>
        <div class="tl-step" id="s2">
          <div class="tl-dot"></div>
          <div class="tl-label">Done</div>
          <div class="tl-line"></div>
        </div>
      </div>

      <div class="main">
        <div class="page active" id="page-welcome">
          <h1>Install Hiraganized</h1>
          <div class="glass-card">
            <div class="dir-picker">
              <input id="installDir" value="C:\Program Files\Hiraganized" readonly>
              <button id="btnBrowse">Browse</button>
            </div>
          </div>
          <div class="footer">
            <button class="btn-primary" id="btnInstall">Install</button>
          </div>
        </div>

        <div class="page" id="page-progress">
          <h1>Installing</h1>
          <div class="progress-section" id="progressList"></div>
          <div class="footer">
            <button class="btn-secondary" id="btnCancel">Cancel</button>
          </div>
        </div>

        <div class="page" id="page-done">
          <div class="done-icon">&#x2713;</div>
          <h1 style="text-align:center;font-weight:300">Installation Complete</h1>
          <div class="checkbox-row">
            <input type="checkbox" id="chkLaunch" checked>
            <label for="chkLaunch">Launch Hiraganized</label>
          </div>
          <div class="footer">
            <button class="btn-primary" id="btnFinish">Finish</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
