<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<title>Select region</title>
<link rel="stylesheet" href="themes.css" />
<style>
@font-face {
  font-family: 'Lexend';
  font-style: normal;
  font-weight: 300 600;
  font-display: swap;
  src: url('../../assets/fonts/Lexend-400.woff2') format('woff2-variations');
  src: url('../../assets/fonts/Lexend-400.woff2') format('woff2');
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  cursor: crosshair;
  user-select: none;
  -webkit-app-region: no-drag;
  font-family: 'Lexend', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.25);
}
.selection-box {
  position: absolute;
  border: 1.5px solid var(--accent);
  background: rgba(255,255,255,0.02);
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.25), 0 0 24px rgba(255,255,255,0.04);
  pointer-events: none;
}
#lens {
  position: fixed;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 4px 18px rgba(0,0,0,0.45);
  pointer-events: none;
  display: none;
  z-index: 10;
}
.info {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30,30,30,0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: rgba(255,255,255,0.6);
  padding: 8px 20px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.05);
  font-family: 'Lexend', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.2px;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="selection-box" id="selectionBox" style="display:none"></div>
<canvas id="lens" width="150" height="150"></canvas>
<div class="info" id="info">Drag to select a region &bull; Esc to cancel</div>
<script src="overlay.js"></script>
</body>
</html>
